name: Verify v0.1.0-pre.6 candidate and release build path

# The release workflow remains tag-only. This job builds unpublished artifacts
# only before publication, for PR review or an explicitly selected main SHA.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-candidate.yml
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - dist-workspace.toml
      - src/**
      - tests/**
      - scripts/release-workflow-build.sh
      - scripts/harden-release-workflow.awk
      - scripts/generate-release-workflow.sh
      - scripts/install-cargo-dist-linux.sh
      - scripts/record-build-environment.py
      - scripts/test_release_candidate_verifier.py
      - scripts/test_release_workflow.py
      - scripts/verify-pre4-compatibility.py
      - scripts/verify-release-candidate.py
      - scripts/verify-public-workflow.py
      - scripts/test_public_workflow.py
      - scripts/verify-candidate-installer.py
      - scripts/verify-published-release.py
      - scripts/verify-release-rehearsal.py
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA in main history to build and verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pre6-candidate-${{ github.event.pull_request.number || inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      build_candidate: ${{ steps.boundary.outputs.build_candidate }}
    steps:
      - name: Select the exact candidate source
        id: source
        shell: bash
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REQUEST_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            source_sha="$PR_SHA"
          else
            source_sha="$REQUEST_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, version, and publication boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.source.outputs.sha }}'
          test -z "$(git status --porcelain)"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" = '0.1.0-pre.6'
          tag_refs="$(git ls-remote --tags origin refs/tags/v0.1.0-pre.6)"
          if [ -n "$tag_refs" ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo 'build_candidate=false' >> "$GITHUB_OUTPUT"
              echo 'v0.1.0-pre.6 is already published; skipping the pre-publication candidate build. Use verify-published-release.yml for published assets.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'v0.1.0-pre.6 is already published; a new pre-publication candidate cannot be built.' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor '${{ steps.source.outputs.sha }}' refs/remotes/origin/main; then
              echo 'candidate SHA is not in main history' >&2
              exit 1
            fi
          fi
          echo "candidate source SHA: $(git rev-parse HEAD)"
          echo 'build_candidate=true' >> "$GITHUB_OUTPUT"
      - name: F1 fixed-format and supported QZI compatibility gate
        if: steps.boundary.outputs.build_candidate == 'true'
        run: |
          cargo test --locked --features internal-testing --test phase2_fixed --test phase8_reader_core --test phase13_sidecar --test phase22_vectors
          cargo test --locked --features internal-testing --lib sidecar::manifest_tests
      - name: Install digest-pinned cargo-dist
        if: steps.boundary.outputs.build_candidate == 'true'
        shell: bash
        run: scripts/install-cargo-dist-linux.sh
      - name: Plan unpublished artifacts
        if: steps.boundary.outputs.build_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(dist --version)" = 'cargo-dist 0.31.0'
          mkdir -p target/candidate
          dist plan --tag=v0.1.0-pre.6 --allow-dirty --output-format=json > target/candidate/plan-dist-manifest.json
          test "$(jq -r .announcement_tag target/candidate/plan-dist-manifest.json)" = 'v0.1.0-pre.6'
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            if [ "$target" = x86_64-pc-windows-msvc ]; then extension=zip; else extension=tar.xz; fi
            jq -e --arg name "qzt-${target}.${extension}" '.artifacts[$name].kind == "executable-zip"' target/candidate/plan-dist-manifest.json >/dev/null
            jq -e --arg name "qzt-${target}.${extension}.sha256" '.artifacts[$name].kind == "checksum"' target/candidate/plan-dist-manifest.json >/dev/null
          done
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.boundary.outputs.build_candidate == 'true'
        with:
          name: artifacts-plan-dist-manifest
          path: target/candidate/plan-dist-manifest.json
          if-no-files-found: error
          retention-days: 14

  build-local:
    needs: plan
    if: needs.plan.outputs.build_candidate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: qzt-aarch64-apple-darwin.tar.xz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: qzt-x86_64-apple-darwin.tar.xz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: qzt-x86_64-unknown-linux-gnu.tar.xz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: qzt-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ matrix.target }}-dist-manifest.json
      BUILD_ENV_NAME: target/distrib/${{ matrix.target }}-build-environment.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify checked-out source and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.source_sha }}'
          test -z "$(git status --porcelain)"
          echo "source=$(git rev-parse HEAD) runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          rustc --version
      - name: Install digest-pinned cargo-dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) archive=cargo-dist-x86_64-unknown-linux-gnu.tar.xz; expected=cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8 ;;
            macOS-X64) archive=cargo-dist-x86_64-apple-darwin.tar.xz; expected=fd4d8f9f07802359cbcdc52bac3abd7d5201c4b73a7cbcdd6faca2232a389f0c ;;
            macOS-ARM64) archive=cargo-dist-aarch64-apple-darwin.tar.xz; expected=decb01c64c12501931c3cac3111b368a7f48adf8d9e65455c08e5757b9a1fd6f ;;
            *) echo "unsupported cargo-dist runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          path="${RUNNER_TEMP}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/${archive}" -o "$path"
          test "$(shasum -a 256 "$path" | awk '{ print $1 }')" = "$expected"
          tar -xJf "$path" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/${archive%.tar.xz}/dist" "${HOME}/.cargo/bin/dist"
      - name: Install digest-pinned cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "cargo-dist-x86_64-pc-windows-msvc.zip"
          $expected = "a14e17557b269b101405e0cc6b647581d56313c954a51c7fddd423bba21e17b2"
          $path = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$archive" -OutFile $path
          if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $expected) { throw "cargo-dist SHA-256 mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "cargo-dist"
          Expand-Archive -Path $path -DestinationPath $destination
          Copy-Item (Join-Path $destination "dist.exe") (Join-Path $env:USERPROFILE ".cargo\bin\dist.exe") -Force
      - name: Pin the Rust toolchain inherited by cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | awk '{ print $1 }')"
          test -n "$toolchain"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Build the native target and run extracted archive smoke
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(dist --version)" = 'cargo-dist 0.31.0'
          mkdir -p target/candidate
          python scripts/record-build-environment.py record \
            --source-sha '${{ needs.plan.outputs.source_sha }}' --target '${{ matrix.target }}' \
            --profile 'dist (release with thin LTO)' --features 'default; no feature override' \
            --build-command 'dist build --tag=v0.1.0-pre.6 --print=linkage --allow-dirty --output-format=json --artifacts=local --target=${{ matrix.target }}' \
            --output "$BUILD_ENV_NAME"
          scripts/release-workflow-build.sh build --tag=v0.1.0-pre.6 --print=linkage --allow-dirty --output-format=json --artifacts=local --target='${{ matrix.target }}'
          python scripts/record-build-environment.py verify --input "$BUILD_ENV_NAME"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          scripts/release-workflow-build.sh print-local >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          scripts/release-workflow-build.sh copy
          python scripts/verify-release-candidate.py local \
            --manifest "$BUILD_MANIFEST_NAME" --source-sha '${{ needs.plan.outputs.source_sha }}' --expected-tag v0.1.0-pre.6 \
            --build-env "$BUILD_ENV_NAME" \
            --target '${{ matrix.target }}' \
            --archive 'target/distrib/${{ matrix.archive }}' \
            --checksum 'target/distrib/${{ matrix.archive }}.sha256' \
            --smoke-profile public-workflow-v1 --vectors-dir tests/vectors --output 'target/candidate/${{ matrix.target }}-evidence.json'
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            ${{ env.BUILD_ENV_NAME }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre6-evidence-${{ matrix.target }}-${{ needs.plan.outputs.source_sha }}
          path: target/candidate/${{ matrix.target }}-evidence.json
          if-no-files-found: error
          retention-days: 14

  build-global:
    needs: [plan, build-local]
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      BUILD_ENV_NAME: target/distrib/global-build-environment.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.source_sha }}'
          test -z "$(git status --porcelain)"
          echo "source=$(git rev-parse HEAD) runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
      - name: Install digest-pinned cargo-dist
        shell: bash
        run: scripts/install-cargo-dist-linux.sh
      - name: Fetch native build artifacts for global checksums
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Pin the Rust toolchain inherited by cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | awk '{ print $1 }')"
          test -n "$toolchain"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Build and inspect unpublished global artifacts
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(dist --version)" = 'cargo-dist 0.31.0'
          mkdir -p target/candidate
          python scripts/record-build-environment.py record \
            --source-sha '${{ needs.plan.outputs.source_sha }}' --target global \
            --profile 'global artifacts; no Rust compile' --features 'not applicable' \
            --build-command 'dist build --tag=v0.1.0-pre.6 --allow-dirty --output-format=json --artifacts=global' \
            --output "$BUILD_ENV_NAME"
          scripts/release-workflow-build.sh build --tag=v0.1.0-pre.6 --allow-dirty --output-format=json --artifacts=global
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          scripts/release-workflow-build.sh print-global >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          scripts/release-workflow-build.sh copy
          python scripts/record-build-environment.py verify --input "$BUILD_ENV_NAME"
          python scripts/verify-release-candidate.py global \
            --manifest "$BUILD_MANIFEST_NAME" --source-sha '${{ needs.plan.outputs.source_sha }}' --expected-tag v0.1.0-pre.6 \
            --build-env "$BUILD_ENV_NAME" \
            --distrib target/distrib --output target/candidate/global-evidence.json
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.build.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            ${{ env.BUILD_ENV_NAME }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre6-evidence-global-${{ needs.plan.outputs.source_sha }}
          path: target/candidate/global-evidence.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [plan, build-local, build-global]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify clean assembly source before artifact download
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.source_sha }}'
          test -z "$(git status --porcelain)"
      - name: Fetch the plan, native, and global artifacts as the release host does
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Fetch the exact source plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: artifacts-plan-dist-manifest
          path: target/candidate
      - name: Stage and inspect files immediately before hosting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/candidate/staged
          cp artifacts/* target/candidate/staged/
          rm -f target/candidate/staged/*-dist-manifest.json
          rm -f target/candidate/staged/*-build-environment.json
          python scripts/verify-release-rehearsal.py \
            --artifacts artifacts --staged target/candidate/staged \
            --plan target/candidate/plan-dist-manifest.json \
            --source-sha '${{ needs.plan.outputs.source_sha }}' \
            --output target/candidate/assembly-evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre6-assembly-evidence-${{ needs.plan.outputs.source_sha }}
          path: target/candidate/assembly-evidence.json
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: [plan, build-local]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: artifacts-build-local-aarch64-apple-darwin
          path: target/distrib
      - name: Compare published pre.3 and candidate pre.6 on the fixed fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.source_sha }}'
          mkdir -p target/candidate/pre3 target/candidate/pre6
          pre3_archive=target/candidate/qzt-pre3-aarch64-apple-darwin.tar.xz
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/albert-einshutoin/qzt/releases/download/v0.1.0-pre.3/qzt-aarch64-apple-darwin.tar.xz \
            -o "$pre3_archive"
          test "$(shasum -a 256 "$pre3_archive" | awk '{ print $1 }')" = \
            '0e51e0a1945b984500ae27a21e56930ba4b06a744a639feffa696307b1255b20'
          pre6_archive=target/distrib/qzt-aarch64-apple-darwin.tar.xz
          test "$(shasum -a 256 "$pre6_archive" | awk '{ print $1 }')" = \
            "$(awk '{ print $1 }' "${pre6_archive}.sha256")"
          tar -xJf "$pre3_archive" -C target/candidate/pre3
          tar -xJf "$pre6_archive" -C target/candidate/pre6
          python scripts/verify-pre4-compatibility.py \
            --candidate-tag v0.1.0-pre.6 \
            --pre3-bin target/candidate/pre3/qzt-aarch64-apple-darwin/qzt \
            --candidate-bin target/candidate/pre6/qzt-aarch64-apple-darwin/qzt \
            --output target/candidate/compatibility.json
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre6-compatibility-${{ needs.plan.outputs.source_sha }}
          path: target/candidate/compatibility.json
          if-no-files-found: error
          retention-days: 14

  native-windows-installer:
    needs: [plan, build-local, build-global]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: artifacts-build-local-x86_64-pc-windows-msvc
          path: target/distrib
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: artifacts-build-global
          path: target/distrib
      - name: Native PowerShell install from explicit candidate staging and C4 workflow
        shell: bash
        run: |
          python scripts/verify-candidate-installer.py \
            --distrib target/distrib --target x86_64-pc-windows-msvc \
            --vectors-dir tests/vectors --expected-tag v0.1.0-pre.6 \
            --source-sha '${{ needs.plan.outputs.source_sha }}' \
            --output target/candidate/windows-installer.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre6-windows-installer-${{ needs.plan.outputs.source_sha }}
          path: target/candidate/windows-installer.json
          if-no-files-found: error
          retention-days: 14
