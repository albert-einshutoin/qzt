name: Verify published v0.1.0-pre.3

# Read-only verification of actual GitHub Release URLs. This workflow never builds
# products, creates tags, or hosts assets.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-published-release.yml
      - scripts/verify-published-release.py
      - scripts/verify-release-candidate.py
      - tests/vectors/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: published-pre3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  global-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download and verify published manifest, sidecars, and global assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/verify-published-release.py global \
            --verifier-sha "$VERIFIER_SHA" \
            --output target/published/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: published-pre3-global
          path: target/published/evidence.json
          if-no-files-found: error
          retention-days: 14

  native-archive-and-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download, checksum, extract, smoke, and install published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/verify-published-release.py local \
            --target '${{ matrix.target }}' \
            --vectors-dir tests/vectors \
            --verifier-sha "$VERIFIER_SHA" \
            --output target/published/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: published-pre3-${{ matrix.target }}
          path: target/published/evidence.json
          if-no-files-found: error
          retention-days: 14
