name: Verify published v0.1.0-pre.6

# Read-only verification of actual GitHub Release URLs. This workflow never builds
# products, creates tags, or hosts assets.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Exact successful tag-only release run ID for the fixed pre.6 source
        type: string
        required: true
      release_run_attempt:
        description: Exact successful release run attempt
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  TAG: v0.1.0-pre.6
  VERSION: qzt 0.1.0-pre.6
  PRODUCT_SHA: 0c8110e6b6e08513b4def3f636b5b79d068e275f
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
  RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}

concurrency:
  group: published-pre6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch fixed product Git object
        run: git fetch --no-tags --depth=1 origin "$PRODUCT_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download and verify published manifest, sidecars, and global assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          python scripts/verify-published-release.py global \
            --tag "$TAG" --version "$VERSION" --smoke-profile public-workflow-v1 \
            --product-sha "$PRODUCT_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --verifier-sha "$VERIFIER_SHA" \
            --output target/published/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: published-pre6-global
          path: target/published/evidence.json
          if-no-files-found: error
          retention-days: 14

  native-archive-and-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download, checksum, extract, smoke, and install published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          python scripts/verify-published-release.py local \
            --tag "$TAG" --version "$VERSION" --smoke-profile public-workflow-v1 \
            --product-sha "$PRODUCT_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --target '${{ matrix.target }}' \
            --vectors-dir tests/vectors \
            --verifier-sha "$VERIFIER_SHA" \
            --output target/published/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: published-pre6-${{ matrix.target }}
          path: target/published/evidence.json
          if-no-files-found: error
          retention-days: 14
