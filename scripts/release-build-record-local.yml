      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Record the toolchain used by the local dist build
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | awk '{ print $1 }')"
          test -n "$toolchain"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$toolchain"
          python scripts/record-build-environment.py record \
            --source-sha "$(git rev-parse HEAD)" \
            --target '${{ join(matrix.targets, ',') }}' \
            --profile 'dist (release with thin LTO)' --features 'default; no feature override' \
            --build-command 'dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --allow-dirty --output-format=json ${{ matrix.dist_args }}' \
            --output "$BUILD_ENV_NAME"
